[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog"
version = "0.1.0"
description = "Folder change tracking and Korean daily/weekly work reports for AI agents (MCP server + CLI + skill)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10",
  "pathspec>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "pypdf>=4.0",
  "Pillow>=10.0",
  "pywin32>=306; sys_platform == 'win32'",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
worklog = "worklog.cli:main"

# Console-less launcher for Task Scheduler (no window flashes every hour).
[project.gui-scripts]
worklogw = "worklog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worklog = ["assets/*.md", "assets/*/*.md", "assets/*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["com: needs Microsoft Office installed (set WORKLOG_TEST_COM=1)"]
